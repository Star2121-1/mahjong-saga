<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a1d12">
    <title>麻将江湖 - 血战到底</title>
    <!-- CSS: 全局基础 + 模块化战场样式 -->
    <link rel="stylesheet" href="../css/common.css?v=20260908I">
    <link rel="stylesheet" href="../css/gameplay/gameplay-layout.css?v=20260908I">
    <link rel="stylesheet" href="../css/gameplay/gameplay-player.css?v=20260908I">
    <link rel="stylesheet" href="../css/gameplay/gameplay-enemy.css?v=20260926G">
    <link rel="stylesheet" href="../css/gameplay/gameplay-overlay.css?v=20260908I">
    <link rel="stylesheet" href="../css/gameplay/gameplay-weapon.css?v=20260908I">
    <link rel="stylesheet" href="../css/gameplay/gameplay-effects.css?v=20260908I">
    <link rel="stylesheet" href="../css/gameplay/gameplay-ui.css?v=20260908I">
    <link rel="stylesheet" href="../css/gameplay/gameplay-responsive.css?v=20260908I">
    <!-- R317 墨底丹青主题：设计令牌 + 覆盖层，必须在所有旧 CSS 之后 -->
    <link rel="stylesheet" href="../css/tokens.css?v=20260926B">
    <link rel="stylesheet" href="../css/theme/01-foundation.css?v=20260926K">
    <link rel="stylesheet" href="../css/theme/02-overlay.css?v=20260926K">
    <link rel="stylesheet" href="../css/theme/03-battlefield.css?v=20260926K">
    <link rel="stylesheet" href="../css/theme/04-enemy.css?v=20260926K">
    <link rel="stylesheet" href="../css/theme/05-hub.css?v=20260926K">
    <link rel="stylesheet" href="../css/theme/06-hand.css?v=20260926K">
    <!-- 核心服务层 (低层依赖) -->
    <script src="../js/core/SaveManager.js?v=20260908I"></script>
    <script src="../js/core/SaveManager.Core.js?v=20260908I"></script>
    <script src="../js/core/SaveManager.Season.js?v=20260908I"></script>
    <script src="../js/core/SaveManager.Weekly.js?v=20260908I"></script>
    <script src="../js/core/SaveManager.Compendium.js?v=20260908I"></script>
    <script src="../js/core/SaveManager.RunStats.js?v=20260926M"></script>
    <!-- R317-P0: Balance.js 必须早于 FxManager.js。
         FxManager.js 在脚本求值时就 self-instantiate，其构造读 window.Balance.FCT_POOL_SIZE_INIT。
         原顺序（Fx #7 / Balance #10）导致 window.Balance 尚不存在 → 抛 TypeError →
         window.fxManager 整个为 undefined → 全部伤害飘字永久失效。
         Balance.js 零依赖，提前加载安全。 -->
    <!-- 数值常量 (所有模块依赖) -->
    <script src="../js/config/Balance.js?v=20260908I"></script>
    <script src="../js/core/FxManager.js?v=20260908I"></script>
    <script src="../js/core/AudioManager.js?v=20260908I"></script>
    <script src="../js/core/RewardManager.js?v=20260908I"></script>
    <!-- 委托系统 -->
    <!-- R241-P0: 恢复GameSpawner.js — 否则敌人不生成（R183-P0误移除） -->
    <script src="../js/core/GameSpawner.js?v=20260908I"></script>
    <script src="../js/core/GameCombat.js?v=20260908I"></script>
    <script src="../js/core/GameSystems.js?v=20260926M"></script>
    <!-- 实体层 -->
    <script src="../js/entities/EquipmentRegistry.js?v=20260908I"></script>
    <script src="../js/config/HeroConfig.js?v=20260908I"></script>
    <script src="../js/entities/HeroRegistry.js?v=20260908I"></script>
    <script src="../js/config/LevelConfig.js?v=20260926L"></script>
    <script src="../js/entities/Player.js?v=20260926I"></script>
    <script src="../js/entities/Enemy.js?v=20260926H"></script>
    <script src="../js/entities/ExpGem.js?v=20260908I"></script>
    <script src="../js/entities/Weapon.js?v=20260908I"></script>
    <!-- 引擎拆分 (最后加载，依赖以上所有) -->
    <script src="../js/core/GameEngine.js?v=20260908I"></script>
    <script src="../js/core/GameEngine.Boot.js?v=20260908I"></script>
    <script src="../js/core/GameEngine.NewRun.js?v=20260926N"></script>
    <script src="../js/core/GameEngine.Loop.js?v=20260926M"></script>
    <script src="../js/core/MahjongHand.js?v=20260908I"></script>
    <script src="../js/core/GameEngine.Spawn.js?v=20260908I"></script>
    <script src="../js/core/GameEngine.Combat.js?v=20260908I"></script>
    <script src="../js/config/AchievementConfig.js?v=20260908I"></script>
    <script src="../js/core/GameEngine.Endgame.js?v=20260908I"></script>
    <script src="../js/core/GameEngine.Render.js?v=20260908I"></script>
    <script src="../js/core/GameEngine.Weapons.js?v=20260908I"></script>
    <script src="../js/core/GameEngine.Events.js?v=20260926M"></script>
    <script src="../js/core/GameEngine.Guide.js?v=20260926N"></script>
    <script src="../js/core/GameEngine.Navigate.js?v=20260908I"></script>
    <script src="../js/core/GameEngine.Abyss.js?v=20260926M"></script>
    <!-- 页面初始化 -->
    <script src="../js/main.js?v=20260908I"></script>
</head>
<body>
    <!-- 屏幕阅读器通知区域 -->
    <div aria-live="assertive" aria-atomic="true" class="sr-only" id="game-announcements"></div>
    <div id="game-container">
        <div id="top-bar">
            <div class="stat" id="wave-display">🌊 第 1 波</div>
            <div id="wave-milestone-banner" class="wave-milestone-banner"></div>
            <div class="stat" id="gold-display">💰 0</div>
            <div class="stat" id="atk-display">⚔️ 10</div>
            <div class="stat" id="kills-display">☠️ 0</div>
            <div id="mutator-badge" class="mutator-badge" style="display:none;"></div>
            <div id="resonance-pills" class="resonance-pills"></div>
            <button id="audio-btn" aria-label="切换声音" title="切换声音">🔊</button>
        </div>
        <div id="exp-bar-container">
            <div id="exp-bar-fill" style="width:0%"></div>
            <div id="exp-bar-text">Lv.1 [ 0 / 15 ]</div>
        </div>
        <div id="rage-bar-container">
            <div id="rage-bar-fill" style="width:0%"></div>
            <div id="rage-bar-text">怒气 0 / 100</div>
        </div>

        <div id="battlefield">
            <div id="world-layer">
                <div id="fct-layer"></div>
                <div id="player">
                    <div id="player-hp-wrap">
                        <div id="player-hp-bar">
                            <div id="player-hp-fill" style="width:100%"></div>
                        </div>
                        <div id="player-hp-text">100/100</div>
                    </div>
                </div>
            </div>

            <div id="boss-hp-bar">
                <span id="boss-hp-label">深渊领主</span>
                <div class="hp-bar-track"><div id="boss-hp-fill" style="width:100%"></div></div>
            </div>

            <div id="wave-announce"></div>

            <div id="joystick-container">
                <div id="joystick-base">
                    <div id="joystick-knob"></div>
                </div>
            </div>
        </div>

        <!-- Overlay layers — 放在 battlefield 外面 -->
        <div id="reward-overlay" role="dialog" aria-modal="true" aria-labelledby="reward-title">
            <div class="reward-title" id="reward-title">选择圣物</div>
            <div class="reward-cards"></div>
        </div>

        <div id="mutator-overlay" role="dialog" aria-modal="true" aria-labelledby="mutator-title">
            <div class="mutator-title" id="mutator-title">⚠ 波次突变</div>
            <div class="mutator-subtitle">当前波次出现异常战况，请选择一种适应策略</div>
            <div class="mutator-choices" id="mutator-choices"></div>
        </div>

        <div id="victory-overlay" role="dialog" aria-modal="true" aria-labelledby="victory-title">
            <h1 id="victory-title">胡牌！大捷！</h1>
            <div class="result">存活时间：<span id="victory-time">00:00</span></div>
            <div class="result">击杀数：<span id="victory-kills">0</span></div>
            <div class="result">圣物：<span id="victory-relics">-</span></div>
            <div class="result">获得核心：<span id="victory-tokens">0</span></div>
            <div id="victory-tips" class="victory-tips"></div>
            <button id="victory-restart-btn">🔄 再来一局</button>
            <button id="victory-continue-btn" style="display:none">🌀 继续挑战</button>
            <button id="victory-hub-btn">返回大本营</button>
        </div>

        <div id="game-over-overlay" role="dialog" aria-modal="true" aria-labelledby="gameover-title">
            <h1 id="gameover-title">GAME OVER</h1>
            <div class="result">存活时间：<span id="result-time">00:00</span></div>
            <div class="result">击杀数：<span id="result-kills">0</span></div>
            <div class="result">波次：<span id="result-wave">-</span></div>
            <div id="death-tips" class="victory-tips" style="color:#ff8888;"></div>
            <div id="death-compensation" class="result" style="color:#ffd700;"></div>
            <button id="restart-btn">🔄 重新开始</button>
            <button id="hub-btn" style="padding:8px 0;font-size:13px;font-weight:600;width:200px;margin-top:4px;background:rgba(255,255,255,0.04);color:#888;border:1px solid #333;border-radius:6px;cursor:pointer;">返回大本营</button>
        </div>

        <div id="pause-overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title">
            <div class="pause-panel">
            <div class="pause-title" id="pause-title">⏸ 游戏暂停</div>
                <button id="pause-continue-btn">▶ 继续游戏</button>
                <button id="pause-hub-btn">返回大本营</button>
                <button id="pause-settings-btn">🎛 音量设置</button>
                <div id="pause-settings-panel" class="settings-section" style="display:none;">
                    <div class="settings-title">音量</div>
                    <label>整体 <input type="range" id="vol-master" min="0" max="100" value="60"> <span id="vol-master-val">60%</span></label>
                    <label>SFX <input type="range" id="vol-sfx" min="0" max="100" value="100"> <span id="vol-sfx-val">100%</span></label>
                    <label>音乐 <input type="range" id="vol-music" min="0" max="100" value="80"> <span id="vol-music-val">80%</span></label>
                    <label>反馈 <input type="range" id="vol-feedback" min="0" max="100" value="90"> <span id="vol-feedback-val">90%</span></label>
                    <label><input type="checkbox" id="mute-toggle"> 静音</label>
                    <button id="settings-close-btn">关闭</button>
                </div>
            </div>
        </div>

        <div id="guide-overlay" role="dialog" aria-modal="true" aria-labelledby="guide-title">
            <div class="guide-panel">
                <div class="guide-title" id="guide-title">⚔ 新手指引</div>
                <div class="guide-body">
                    <div class="guide-item"><span class="guide-key">WASD</span> / 方向键 移动</div>
                    <div class="guide-item"><span class="guide-key">点击地面</span> 走位 / 点击敌人攻击</div>
                    <div class="guide-item"><span class="guide-key">空格</span> 怒气满时触发 Overdrive</div>
                    <div class="guide-item"><span class="guide-key">Esc</span> / ⏸ 暂停游戏</div>
                    <div class="guide-item"><span class="guide-key">拾取</span> 击杀掉落铜筹码与经验石，自动吸附</div>
                    <div class="guide-item"><span class="guide-key">升级</span> 弹出三选一麻将牌，强化天命手牌</div>
                </div>
                <div class="guide-steps-dots"></div>
                <button id="guide-confirm-btn">明白了，出征！</button>
                <div class="guide-nav">
                    <button id="guide-prev-btn" disabled>← 上一步</button>
                    <button id="guide-next-btn">下一步 →</button>
                </div>
            </div>
        </div>

        <div id="weapon-slot-bar">
            <div class="weapon-slots" id="weapon-slots"></div>
        </div>

        <!-- 天命手牌槽 — 14 列 CSS Grid -->
        <div id="hand-tile-bar">
            <div id="hand-tile-grid">
                <!-- 14 个槽位由 JS 动态生成 -->
            </div>
        </div>

        <div id="bottom-bar">
            <div class="hint" id="time-display">⏱ 00:00</div>
            <button id="pause-btn" aria-label="暂停游戏">⏸ 暂停</button>
        </div>
    </div>
    <script src="../js/responsive.js?v=20260908B"></script>
</body>
</html>
